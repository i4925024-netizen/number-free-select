<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#075e54">
<title>Phone Number Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#172033}.app{max-width:1000px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top h1{margin:0;font-size:22px}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.grid label{font-size:12px;font-weight:bold}.grid input,.grid select{width:100%;padding:11px;border:1px solid #ccd3dd;border-radius:8px;margin-top:4px;background:#fff}.buttons,.tabs,.bulk{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:8px;padding:10px 13px;background:#e7edf5;color:#172033;font-weight:bold;cursor:pointer}.primary{background:#075e54;color:#fff}.danger{background:#b42318;color:#fff}.restore{background:#176b3a;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.tabs button.active{background:#075e54;color:#fff}.stats{display:flex;gap:15px;flex-wrap:wrap;margin:13px 0;font-size:13px}.tableWrap{overflow:auto;border:1px solid #e1e6ed;border-radius:9px}.row{display:grid;grid-template-columns:42px 70px minmax(190px,1fr) 130px;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #edf0f4;min-width:520px}.row.head{font-weight:bold;background:#f7f9fb}.row:last-child{border-bottom:0}.num{font-family:Consolas,monospace;word-break:break-all}.deleted .num{text-decoration:line-through;color:#9a3412}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px}.pager button{padding:8px 12px}.empty{text-align:center;padding:35px;color:#667085}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;width:0;background:#075e54}.hidden{display:none!important}.status{margin-top:8px;font-size:12px;color:#475467;min-height:16px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:38px 55px minmax(180px,1fr) 105px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.app{padding:8px}.card{padding:11px}}
</style>
</head>
<body>
<div class="app"><div class="card">
<div class="top"><div><h1>Global Phone Number Generator</h1><div class="muted">Generate, continue, delete, restore and export large number lists.</div></div><button class="btn" id="clearDataBtn">Clear Saved Data</button></div>
<div class="grid">
<label>Country<select id="country"><option value="+93">Afghanistan (+93)</option><option value="+355">Albania (+355)</option><option value="+213">Algeria (+213)</option><option value="+54">Argentina (+54)</option><option value="+61">Australia (+61)</option><option value="+880">Bangladesh (+880)</option><option value="+55">Brazil (+55)</option><option value="+1">Canada/USA (+1)</option><option value="+86">China (+86)</option><option value="+20">Egypt (+20)</option><option value="+33">France (+33)</option><option value="+49">Germany (+49)</option><option value="+91">India (+91)</option><option value="+62">Indonesia (+62)</option><option value="+98">Iran (+98)</option><option value="+964">Iraq (+964)</option><option value="+81">Japan (+81)</option><option value="+60">Malaysia (+60)</option><option value="+92" selected>Pakistan (+92)</option><option value="+974">Qatar (+974)</option><option value="+7">Russia (+7)</option><option value="+966">Saudi Arabia (+966)</option><option value="+27">South Africa (+27)</option><option value="+82">South Korea (+82)</option><option value="+90">Turkey (+90)</option><option value="+971">UAE (+971)</option><option value="+44">United Kingdom (+44)</option></select></label>
<label>Starting number<input id="start" value="3000000000" inputmode="numeric"></label>
<label>Quantity<input id="amount" value="1000" type="number" min="1" max="1000000"></label>
<label>Rows per page<select id="pageSize"><option>100</option><option selected>250</option><option>500</option><option>1000</option></select></label>
</div>
<div class="buttons"><button class="btn primary" id="generateBtn">Generate</button><button class="btn primary" id="continueBtn">Continue Generating</button><button class="btn" id="vcfBtn">Save Active VCF</button><button class="btn" id="txtBtn">Save Active TXT</button></div>
<div class="progress hidden" id="progress"><i id="bar"></i></div><div class="status" id="status"></div>
<div class="stats"><span>Total: <b id="total">0</b></span><span>Active: <b id="active">0</b></span><span>Trash: <b id="trash">0</b></span><span>Selected: <b id="selected">0</b></span></div>
<div class="tabs"><button class="btn active" id="allTab">Active Numbers</button><button class="btn" id="trashTab">Trash</button></div>
<div class="bulk"><button class="btn" id="selectPageBtn">Select Page</button><button class="btn" id="selectAllBtn">Select All</button><button class="btn danger" id="deleteBtn">Delete Selected</button><button class="btn restore" id="restoreBtn">Restore Selected</button><button class="btn danger" id="emptyTrashBtn">Empty Trash</button></div>
<div class="tableWrap"><div class="row head"><span>✓</span><span>#</span><span>Number</span><span>Action</span></div><div id="list"></div></div>
<div class="pager"><button class="btn" id="prevBtn">‹ Previous</button><span id="pageInfo">Page 1 / 1</span><button class="btn" id="nextBtn">Next ›</button></div>
</div></div>
<script>
'use strict';
const KEY='phone-generator-v2';
let state={records:[],nextStart:null,view:'active',page:1,selected:new Set()};
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify({records:state.records,nextStart:state.nextStart}))}catch(e){setStatus('Storage is full; export your data before continuing.')}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.records)){state.records=x.records;state.nextStart=x.nextStart}}catch(e){}};
function setStatus(s){$('status').textContent=s}
function activeRecords(){return state.records.filter(r=>!r.deleted)}
function trashRecords(){return state.records.filter(r=>r.deleted)}
function visible(){return state.view==='trash'?trashRecords():activeRecords()}
function render(){const arr=visible(),size=Number($('pageSize').value),pages=Math.max(1,Math.ceil(arr.length/size));state.page=Math.min(state.page,pages);const start=(state.page-1)*size;const page=arr.slice(start,start+size);$('list').innerHTML=page.length?page.map((r,i)=>`<div class="row ${r.deleted?'deleted':''}"><input type="checkbox" data-id="${r.id}" ${state.selected.has(r.id)?'checked':''}><span>${start+i+1}</span><span class="num">${escapeHtml(r.phone)}</span><span><button class="btn ${r.deleted?'restore':'danger'}" data-action="${r.deleted?'restore':'delete'}" data-id="${r.id}">${r.deleted?'Restore':'Delete'}</button></span></div>`).join(''):`<div class="empty">${state.view==='trash'?'Trash is empty.':'No generated numbers yet.'}</div>`;$('pageInfo').textContent=`Page ${state.page} / ${pages}`;$('prevBtn').disabled=state.page<=1;$('nextBtn').disabled=state.page>=pages;$('total').textContent=state.records.length.toLocaleString();$('active').textContent=activeRecords().length.toLocaleString();$('trash').textContent=trashRecords().length.toLocaleString();$('selected').textContent=state.selected.size; $('restoreBtn').disabled=state.view!=='trash'||!state.selected.size;$('deleteBtn').disabled=state.view==='trash'||!state.selected.size;$('emptyTrashBtn').disabled=!trashRecords().length;}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setView(v){state.view=v;state.page=1;state.selected.clear();$('allTab').classList.toggle('active',v==='active');$('trashTab').classList.toggle('active',v==='trash');render()}
function generate(reset){let code=$('country').value,startText=(reset?$startValue():state.nextStart||$startValue()),amount=Math.floor(Number($('amount').value));if(!/^\d+$/.test(startText)||amount<1||amount>1000000)return setStatus('Enter a valid starting number and quantity (1–1,000,000).');let start=BigInt(startText),existing=new Set(state.records.map(r=>r.phone)),made=0,i=0;showProgress(true);function chunk(){const end=Math.min(amount,i+2000);for(;i<end;i++){const phone=code+(start+BigInt(i)).toString();if(!existing.has(phone)){state.records.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),phone,deleted:false});existing.add(phone);made++}}$('bar').style.width=Math.round(i/amount*100)+'%';setStatus(`Generating ${i.toLocaleString()} / ${amount.toLocaleString()}…`);if(i<amount){setTimeout(chunk,0)}else{state.nextStart=(start+BigInt(amount)).toString();save();showProgress(false);state.view='active';state.page=Math.max(1,Math.ceil(activeRecords().length/Number($('pageSize').value)));render();setStatus(`${made.toLocaleString()} new numbers generated. Next continuation starts at ${state.nextStart}.`)}}chunk()}
function $startValue(){return $('start').value.trim()}
function continueGenerate(){if(!state.records.length)return generate(true);generate(false)}
function showProgress(on){$('progress').classList.toggle('hidden',!on);if(on)$('bar').style.width='0%'}
function toggle(id,checked){checked?state.selected.add(id):state.selected.delete(id);render()}
function bulkDelete(){if(!state.selected.size)return;for(const r of state.records)if(state.selected.has(r.id))r.deleted=true;state.selected.clear();save();render();setStatus('Selected numbers moved to Trash.')}
function bulkRestore(){if(!state.selected.size)return;for(const r of state.records)if(state.selected.has(r.id))r.deleted=false;state.selected.clear();save();render();setStatus('Selected numbers restored.')}
function emptyTrash(){if(!trashRecords().length)return;if(!confirm('Permanently delete all numbers in Trash?'))return;state.records=activeRecords();state.selected.clear();save();render();setStatus('Trash permanently emptied.')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function saveVCF(){const a=activeRecords();if(!a.length)return setStatus('No active numbers to export.');let out='';a.forEach((r,i)=>out+=`BEGIN:VCARD\nVERSION:3.0\nFN:Number ${i+1}\nTEL:${r.phone}\nEND:VCARD\n`);download('phone_numbers.vcf',out,'text/vcard;charset=utf-8');setStatus(`Exported ${a.length.toLocaleString()} active numbers.`)}
function saveTXT(){const a=activeRecords();download('phone_numbers.txt',a.map(r=>r.phone).join('\n'),'text/plain;charset=utf-8');setStatus(`Exported ${a.length.toLocaleString()} active numbers.`)}
$('generateBtn').onclick=()=>{state.records=[];state.nextStart=null;state.selected.clear();save();generate(true)};
$('continueBtn').onclick=continueGenerate;
$('country').onchange=()=>{$('start').focus()};$('allTab').onclick=()=>setView('active');$('trashTab').onclick=()=>setView('trash');$('prevBtn').onclick=()=>{state.page--;render()};$('nextBtn').onclick=()=>{state.page++;render()};$('pageSize').onchange=()=>{state.page=1;render()};$('deleteBtn').onclick=bulkDelete;$('restoreBtn').onclick=bulkRestore;$('emptyTrashBtn').onclick=emptyTrash;$('vcfBtn').onclick=saveVCF;$('txtBtn').onclick=saveTXT;
$('selectPageBtn').onclick=()=>{for(const el of document.querySelectorAll('#list input[data-id]'))state.selected.add(el.dataset.id);render()};$('selectAllBtn').onclick=()=>{for(const r of visible())state.selected.add(r.id);render()};$('clearDataBtn').onclick=()=>{if(confirm('Permanently clear all generated data?')){state={records:[],nextStart:null,view:'active',page:1,selected:new Set()};localStorage.removeItem(KEY);render();setStatus('All saved data cleared.')}};
$('list').addEventListener('change',e=>{if(e.target.matches('input[data-id]'))toggle(e.target.dataset.id,e.target.checked)});$('list').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const r=state.records.find(x=>x.id===b.dataset.id);if(!r)return;if(b.dataset.action==='delete')r.deleted=true;else r.deleted=false;state.selected.delete(r.id);save();render();setStatus(r.deleted?'Number moved to Trash.':'Number restored.')});
load();render();
</script>
</body></html>
